<style>
    :root { color-scheme: dark; --bg: #0F1016; --text: #F9F9F9; --text-2: #CACACA; --text-3: #8F9098; --line: rgba(255, 255, 255, 0.12); --accent: #3D7EFF; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .bg-img {
        position: absolute; inset: 0; background: url("https://image.tmdb.org/t/p/w1280/RUBG86JQ81CV6DMm0RKdGln2Kr.jpg") center 30% / cover no-repeat;
        opacity: 0; transform: scale(1.08); animation: bgIn 2.4s var(--ease) 0.1s forwards;
    }
    .bg::after {
        content: ''; position: absolute; inset: 0;
        background:
            radial-gradient(70% 60% at 50% 45%, rgba(15, 16, 22, 0.6), rgba(15, 16, 22, 0.95) 100%),
            linear-gradient(0deg, var(--bg) 0%, rgba(15, 16, 22, 0.25) 45%, rgba(15, 16, 22, 0.8) 100%);
    }
    @keyframes bgIn { to { opacity: 0.8; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

    header { padding: calc(24px + env(safe-area-inset-top)) clamp(20px, 4vw, 56px) 0; animation: rise 0.8s var(--ease) both; }
    .brand { font: 700 22px/1 'Outfit', 'Inter', sans-serif; letter-spacing: -0.02em; }
    .brand span { font-weight: 500; }

    main { flex: 1; display: grid; place-items: center; padding: 40px 20px; text-align: center; }
    .card { width: 100%; max-width: 560px; }
    .card > * { animation: rise 0.9s var(--ease) both; }
    .card > :nth-child(2) { animation-delay: 0.08s; }
    .card > :nth-child(3) { animation-delay: 0.16s; }
    .card > :nth-child(4) { animation-delay: 0.24s; }
    .card > :nth-child(5) { animation-delay: 0.32s; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; margin-bottom: 22px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); font: 700 11.5px/1 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: #F5A524; }
    h1 { margin-bottom: 14px; font: 700 clamp(34px, 6vw, 56px)/1.04 'Outfit', 'Inter', sans-serif; letter-spacing: -0.025em; text-wrap: balance; }
    p.lead { margin: 0 auto 30px; max-width: 460px; color: var(--text-2); font-size: 17px; line-height: 1.6; }
    .bar { position: relative; width: min(280px, 80%); height: 4px; margin: 0 auto 34px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, 0.12); }
    .bar span { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: inherit; background: var(--text); animation: slide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 26px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--line);
        font: 600 15px/1 'Inter', sans-serif; text-decoration: none;
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        transition: background 0.2s, border-color 0.2s, transform 0.2s var(--ease);
    }
    .btn svg { width: 22px; height: 18px; }
    .btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.26); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid #8DB1FF; outline-offset: 3px; }
    .small { margin-top: 18px; color: var(--text-3); font-size: 13.5px; }
    footer { padding: 0 20px calc(22px + env(safe-area-inset-bottom)); text-align: center; color: var(--text-3); font-size: 12.5px; animation: rise 0.8s var(--ease) 0.5s both; }
    @media (max-width: 480px) { .btn { width: 100%; } p.lead { font-size: 15.5px; } }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        .bar span { width: 100%; }
    }
</style>
