<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · litestreamsite</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07090F">
    <script>
        // Send links the site can handle into the app instead of showing this page:
        // share links whose page hasn't been built yet (/s/<show>/<season>/<episode>/), and
        // app pages typed without the "#" (e.g. /shows or /details/ninjago).
        (function () {
            var p = location.pathname, q = new URLSearchParams(location.search), t = q.get('t');
            var share = p.match(/^(.*?\/)s\/([^\/]+)\/?(?:(\d+)\/(\d+)\/?)?$/);
            if (share) {
                location.replace(share[1] + '#/details/' + share[2] + (share[3] ? '/' + share[3] + '/' + share[4] : '') + (t ? '?t=' + encodeURIComponent(t) : ''));
                return;
            }
            var app = p.match(/^\/((?:shows|movies|coming-soon|my-list|faq|search|details|person)(?:\/.*)?)$/);
            if (app) location.replace('/#/' + app[1].replace(/\/+$/, ''));
        })();
    </script>
    <link rel="icon" href="/images/icons/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(90% 70% at 50% 0%, rgba(61, 126, 255, 0.16), transparent 60%), #07090F;
            color: #F3F5FA; text-align: center;
        }
        .code { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #8C96AD; margin-bottom: 10px; }
        h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; margin-bottom: 12px; }
        p { color: #A7B0C3; max-width: 420px; margin: 0 auto 28px; line-height: 1.6; }
        a { display: inline-flex; align-items: center; height: 46px; padding: 0 24px; border-radius: 10px; background: #F3F5FA; color: #0B0F18; font-weight: 700; text-decoration: none; }
        a:hover { background: #fff; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>This page wandered off</h1>
        <p>We couldn't find what you were looking for. Head back home to keep watching.</p>
        <a href="/">Back to litestreamsite</a>
    </main>
</body>
</html>
